<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bidding Player — Control Plane</title>
<style>
  :root{--bg:#f5f7fc;--panel:#ffffff;--panel2:#f0f2fa;--line:#e3e7f2;--ink:#242b45;
    --muted:#6d7698;--accent:#0fb5a0;--good:#0fa97f;--warn:#c98a00;--bad:#e0555a;--lav:#8e7fe0;
    --lav-soft:#f1eefc;--teal-soft:#e6f7f4;--r:10px;}
  *{box-sizing:border-box;} body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  header{display:flex;align-items:center;gap:12px;padding:12px 20px;background:linear-gradient(90deg,var(--lav-soft),var(--teal-soft));
    border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;}
  header h1{font-size:15px;margin:0;font-weight:650;color:var(--accent);} .tag{font-size:11px;color:var(--muted);
    border:1px solid var(--line);padding:2px 8px;border-radius:20px;background:#fff;} .spacer{flex:1;}
  nav{display:flex;gap:4px;padding:0 14px;background:#fff;border-bottom:1px solid var(--line);
    position:sticky;top:49px;z-index:9;}
  nav button{background:none;border:none;color:var(--muted);padding:12px 14px;font:inherit;cursor:pointer;border-bottom:2px solid transparent;}
  nav button.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600;}
  .crumbs{padding:9px 20px;background:#fff;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);}
  .crumbs a{color:var(--accent);cursor:pointer;text-decoration:none;} .crumbs b{color:var(--ink);}
  .wrap{max-width:1120px;margin:0 auto;padding:20px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px;}
  .card h2{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:0 0 12px;}
  label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px;}
  .tip{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;
    border:1px solid var(--muted);color:var(--muted);font-size:10px;line-height:1;cursor:help;position:relative;
    margin-left:5px;vertical-align:middle;font-style:normal;font-weight:700;user-select:none;}
  .tip:hover,.tip:focus{border-color:var(--accent);color:var(--accent);outline:none;}
  .tip .bub{position:absolute;bottom:calc(100% + 7px);left:50%;transform:translateX(-50%);width:250px;max-width:72vw;
    background:var(--ink);color:#fff;font-size:11.5px;font-weight:400;line-height:1.45;text-transform:none;letter-spacing:0;
    text-align:left;padding:8px 10px;border-radius:7px;box-shadow:0 8px 24px rgba(40,43,69,.28);opacity:0;visibility:hidden;
    transition:opacity .12s;z-index:60;pointer-events:none;white-space:normal;}
  .tip .bub code{background:rgba(255,255,255,.16);color:#fff;}
  .tip .bub::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--ink);}
  .tip:hover .bub,.tip:focus .bub{opacity:1;visibility:visible;}
  input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:9px 10px;font:inherit;}
  textarea{font-family:ui-monospace,Menlo,monospace;font-size:12px;} input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);}
  button.btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer;margin-top:12px;}
  button.btn:hover{filter:brightness(1.08);} button.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);}
  button.small{padding:5px 10px;font-size:12px;margin-top:0;} button.danger{background:transparent;border:1px solid var(--bad);color:var(--bad);}
  .row{display:flex;gap:10px;flex-wrap:wrap;} .row>*{flex:1;min-width:120px;}
  ul.list{list-style:none;margin:0;padding:0;} ul.list li{padding:11px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;
    cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;} ul.list li:hover{border-color:var(--lav);background:var(--lav-soft);}
  .id{font-size:11px;color:var(--muted);font-family:ui-monospace,Menlo,monospace;}
  .pill{font-size:10px;padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;}
  .pill.on{color:var(--good);border-color:var(--good);} .pill.warn{color:var(--warn);border-color:var(--warn);} .pill.bad{color:var(--bad);border-color:var(--bad);}
  pre{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto;font:12px/1.5 ui-monospace,Menlo,monospace;
    color:#33406b;max-height:360px;white-space:pre-wrap;word-break:break-all;}
  .df-line{display:block;padding:0 4px;margin:0 -4px;border-radius:3px;}
  .df-del{background:rgba(224,85,90,.16);color:#a83232;} .df-add{background:rgba(15,169,127,.16);color:#0c7a52;}
  .muted{color:var(--muted);font-size:12px;} .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;} @media(max-width:820px){.grid2{grid-template-columns:1fr;}}
  fieldset{border:1px solid var(--line);border-radius:8px;padding:12px;margin:12px 0 0;} legend{font-size:11px;color:var(--muted);padding:0 6px;}
  .subtabs{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap;} .subtabs button{background:var(--panel2);border:1px solid var(--line);color:var(--muted);
    padding:7px 13px;border-radius:8px;font:inherit;cursor:pointer;} .subtabs button.active{color:var(--accent);border-color:var(--accent);background:var(--teal-soft);font-weight:600;}
  .toast{position:fixed;bottom:20px;right:20px;background:var(--panel2);border:1px solid var(--line);padding:12px 16px;border-radius:8px;
    max-width:380px;box-shadow:0 8px 30px rgba(0,0,0,.5);font-size:13px;z-index:50;} .toast.err{border-color:var(--bad);} .toast.ok{border-color:var(--good);}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;} .kpi{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px;}
  .kpi .v{font-size:22px;font-weight:700;} .kpi .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;} .kpi .s{font-size:11px;color:var(--muted);margin-top:2px;}
  table{width:100%;border-collapse:collapse;font-size:13px;} th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);overflow-wrap:anywhere;word-break:break-word;} th{color:var(--muted);font-size:11px;text-transform:uppercase;white-space:nowrap;}
  td.nowrap{white-space:nowrap;}
  th.sort{cursor:pointer;user-select:none;} th.sort:hover,th.sort.on{color:var(--accent);}
  table.rep td{white-space:nowrap;} table.rep tfoot td{border-top:2px solid var(--line);border-bottom:none;background:var(--panel2);}
  a.drill{color:inherit;text-decoration:none;border-bottom:1px dashed var(--muted);} a.drill:hover{color:var(--accent);border-color:var(--accent);}
  .kgrp{margin-top:12px;} .kgrp:first-child{margin-top:0;} .kgl{font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.5px;margin:0 0 6px;display:flex;align-items:center;gap:6px;}
  .kgl::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--muted);}
  .g-hb .kgl{color:var(--lav);} .g-hb .kgl::before{background:var(--lav);} .g-gam .kgl{color:var(--accent);} .g-gam .kgl::before{background:var(--accent);}
  .g-page .kgl{color:var(--muted);} .kgrp.g-hb .kpi{border-left:3px solid var(--lav);} .kgrp.g-gam .kpi{border-left:3px solid var(--accent);}
  .hbbars .bar>i,.spark.hbbars i{background:var(--lav);}
  .kpi.nc .v{color:var(--muted);} .kpi.nc{background:#fff;border-style:dashed;}
  table.rep tr.band th{font-size:10px;letter-spacing:.6px;padding:5px 10px;border-bottom:none;}
  table.rep tr.band th.g-hb{background:var(--lav-soft);color:var(--lav);} table.rep tr.band th.g-gam{background:var(--teal-soft);color:var(--accent);}
  table.rep tr.band th.g-page{background:var(--panel2);}
  table.rep .gstart{border-left:2px solid var(--line);}
  button.colv.on,button.preset.on{border-color:var(--accent);color:var(--accent);background:var(--teal-soft);}
  button:disabled{opacity:.45;cursor:default;}
  .tblwrap{overflow-x:auto;}
  .bar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;} .bar>i{display:block;height:100%;background:var(--accent);}
  .funnel .flabel{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px;} .funnel>div{margin-bottom:8px;}
  .spark{display:flex;align-items:flex-end;gap:2px;height:80px;} .spark i{flex:1;background:var(--accent);border-radius:2px 2px 0 0;min-height:2px;}
  .hide{display:none;} code{font-family:ui-monospace,Menlo,monospace;background:var(--panel2);padding:1px 5px;border-radius:4px;font-size:12px;}
  .check{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:13px;} .check .ic{flex:0 0 auto;}
  .empty{color:var(--muted);padding:20px;text-align:center;border:1px dashed var(--line);border-radius:8px;}
  .hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;} .hdr h2{margin:0;}
  .modal-bg{position:fixed;inset:0;background:rgba(40,43,69,.35);backdrop-filter:blur(2px);display:flex;
    align-items:flex-start;justify-content:center;padding:60px 16px;z-index:100;}
  .modal{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;width:100%;max-width:440px;
    box-shadow:0 20px 60px rgba(40,43,69,.25);} .modal h3{margin:0 0 14px;font-size:15px;} .modal.wide{max-width:820px;}
  .modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;}
</style>
</head>
<body>
<header><h1>Bidding Player</h1><span class="tag">Control Plane</span><div class="spacer"></div>
  <span class="muted" id="who"></span><button class="ghost small hide" id="logoutBtn" style="margin:0">Log out</button></header>
<nav class="hide" id="nav">
  <button data-top="publishers" class="active">Publishers</button>
  <button data-top="demand">Demand Partners</button>
  <button data-top="analytics">Analytics</button>
  <button data-top="history">History</button>
</nav>
<div class="crumbs hide" id="crumbs"></div>

<div class="wrap">
  <div class="card hide" id="loginCard" style="max-width:380px;margin:60px auto;">
    <h2>Sign in</h2>
    <label>Username</label><input id="lUser" value="admin" />
    <label>Password</label><input id="lPass" type="password" value="admin" />
    <button class="btn" id="loginBtn" style="width:100%">Sign in</button>
    <p class="muted" id="loginMsg"></p>
  </div>
  <div id="main"></div>
</div>

<script>
let TOKEN=localStorage.getItem("cp_token")||"";
const S={top:"publishers",pub:null,sub:"properties",site:null,au:null,plc:null,plcTab:"prebid",_demand:[]};
const $=s=>document.querySelector(s);
function toast(m,k="ok"){const t=document.createElement("div");t.className="toast "+k;t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3400);}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
// Inline help marker: a "?" chip that reveals an explanatory bubble on hover/focus.
// `t` may contain <code> markup (trusted, authored below), so it is NOT escaped.
function tip(t){return `<span class="tip" tabindex="0" role="note" aria-label="${esc(t.replace(/<[^>]+>/g,""))}">?<span class="bub">${t}</span></span>`;}
// Spec-driven modal form. fields:[{key,label,type?,value?,placeholder?,options?,hint?}]. onSubmit(values) may throw to keep open.
function openForm(opts){
  const bg=document.createElement("div");bg.className="modal-bg";
  const body=(opts.fields||[]).map(f=>{
    if(f.type==="select")return `<label>${esc(f.label)}</label><select data-k="${f.key}">${(f.options||[]).map(o=>`<option value="${esc(o.value)}" ${o.value===f.value?"selected":""}>${esc(o.label)}</option>`).join("")}</select>`;
    if(f.type==="checkbox")return `<label style="display:flex;gap:8px;align-items:center;margin-top:12px"><input type="checkbox" data-k="${f.key}" style="width:auto" ${f.value?"checked":""}/> ${esc(f.label)}</label>`;
    if(f.type==="textarea")return `<label>${esc(f.label)}</label><textarea data-k="${f.key}" rows="3" placeholder="${esc(f.placeholder||"")}">${esc(f.value||"")}</textarea>`;
    return `<label>${esc(f.label)}</label><input data-k="${f.key}" value="${esc(f.value??"")}" placeholder="${esc(f.placeholder||"")}"/>${f.hint?`<p class="muted" style="margin:4px 0 0">${esc(f.hint)}</p>`:""}`;
  }).join("");
  bg.innerHTML=`<div class="modal"><h3>${esc(opts.title)}</h3><div>${body}</div>${opts.note?`<p class="muted" style="margin-top:10px">${opts.note}</p>`:""}
    <div class="actions"><button class="btn ghost" data-x>Cancel</button><button class="btn" data-ok>${esc(opts.submitLabel||"Save")}</button></div></div>`;
  document.body.appendChild(bg);
  const close=()=>bg.remove();
  bg.addEventListener("click",e=>{if(e.target===bg)close();});
  document.addEventListener("keydown",function esc2(e){if(e.key==="Escape"){close();document.removeEventListener("keydown",esc2);}});
  bg.querySelector("[data-x]").onclick=close;
  const f0=bg.querySelector("input,select,textarea");if(f0)f0.focus();
  bg.querySelector("[data-ok]").onclick=async()=>{
    const v={};bg.querySelectorAll("[data-k]").forEach(i=>{v[i.dataset.k]=i.type==="checkbox"?i.checked:i.value;});
    try{await opts.onSubmit(v);close();}catch(e){toast(e.message,"err");}
  };
}
// Line-level LCS diff (classic O(n*m) DP — fine for the small pretty-printed JSON blobs
// this is used on). Returns {before,after}, each a list of {t:"same"|"del"|"add",l:line}.
function diffLines(a,b){
  const n=a.length,m=b.length;
  if(n*m>250000)return{before:a.map(l=>({t:"same",l})),after:b.map(l=>({t:"same",l}))};
  const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)
    dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  let i=0,j=0;const before=[],after=[];
  while(i<n&&j<m){
    if(a[i]===b[j]){before.push({t:"same",l:a[i]});after.push({t:"same",l:b[j]});i++;j++;}
    else if(dp[i+1][j]>=dp[i][j+1]){before.push({t:"del",l:a[i]});i++;}
    else{after.push({t:"add",l:b[j]});j++;}
  }
  while(i<n){before.push({t:"del",l:a[i]});i++;}
  while(j<m){after.push({t:"add",l:b[j]});j++;}
  return{before,after};
}
function diffLinesHtml(lines){
  return lines.map(x=>`<span class="df-line df-${x.t}">${esc(x.l)}</span>`).join("\n");
}
// Read-only popup for content too large to inline (e.g. a JSON diff). `bodyHtml` is trusted/pre-escaped by the caller.
function openViewer(title,bodyHtml){
  const bg=document.createElement("div");bg.className="modal-bg";
  bg.innerHTML=`<div class="modal wide"><h3>${esc(title)}</h3><div>${bodyHtml}</div>
    <div class="actions"><button class="btn ghost" data-x>Close</button></div></div>`;
  document.body.appendChild(bg);
  const close=()=>bg.remove();
  bg.addEventListener("click",e=>{if(e.target===bg)close();});
  document.addEventListener("keydown",function esc2(e){if(e.key==="Escape"){close();document.removeEventListener("keydown",esc2);}});
  bg.querySelector("[data-x]").onclick=close;
}
// Soft-delete confirm. For parents pass cascadeLabel -> a checkbox that adds
// ?cascade=true; leaving it unchecked and hitting a 409 keeps the modal open with
// the server's "pass ?cascade=true" message, so the user can tick it and retry.
function askDelete({kind,path,name,cascadeLabel,after}){
  openForm({title:`Delete ${esc(kind)}?`,submitLabel:"Delete",
    note:`“${esc(name)}” will be removed. This is a soft delete — restore it from the History tab.`,
    fields:cascadeLabel?[{key:"casc",type:"checkbox",label:cascadeLabel}]:[],
    onSubmit:async v=>{
      const q=(cascadeLabel&&v.casc)?"?cascade=true":"";
      await api(path+q,{method:"DELETE"});
      toast(kind+" deleted");if(after)await after();
    }});
}
async function api(path,{method="GET",body=null,auth=true}={}){const h={"Content-Type":"application/json"};if(auth&&TOKEN)h.Authorization="Bearer "+TOKEN;
  const r=await fetch(path,{method,headers:h,body:body?JSON.stringify(body):null});
  // Only an AUTHENTICATED call can have an expired session. The login endpoint
  // also answers 401 — for bad credentials — and blanket-treating that as expiry
  // showed "Session expired" to someone who had simply mistyped their password,
  // while logout() wiped the token they never had. Let those fall through to the
  // server's own message ("Invalid credentials").
  if(r.status===401&&auth){logout();throw new Error("Session expired — please log in again");}
  const t=await r.text();const d=t?JSON.parse(t):null;if(!r.ok){const e=d&&d.detail;throw new Error(typeof e==="string"?e:JSON.stringify(e||d));}return d;}

// ---- auth ----
function showLogin(){$("#loginCard").classList.remove("hide");$("#nav").classList.add("hide");$("#crumbs").classList.add("hide");
  $("#main").innerHTML="";$("#logoutBtn").classList.add("hide");$("#who").textContent="";}
function showApp(){$("#loginCard").classList.add("hide");$("#nav").classList.remove("hide");$("#logoutBtn").classList.remove("hide");
  $("#who").textContent="admin";go({top:"publishers",pub:null,site:null,au:null,plc:null});}
function logout(){TOKEN="";localStorage.removeItem("cp_token");showLogin();}
$("#loginBtn").onclick=async()=>{try{const d=await api("/auth/login",{method:"POST",auth:false,body:{username:$("#lUser").value,password:$("#lPass").value}});
  TOKEN=d.access_token;localStorage.setItem("cp_token",TOKEN);showApp();}catch(e){$("#loginMsg").textContent=e.message;}};
$("#logoutBtn").onclick=logout;
document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>go({top:b.dataset.top,pub:b.dataset.top==="publishers"?S.pub:null,site:null,au:null,plc:null}));

// ---- router ----
function go(patch){Object.assign(S,patch);render().catch(e=>toast(e.message,"err"));}
document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active"));
function setNav(){document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.top===S.top));}
function crumb(parts){$("#crumbs").classList.remove("hide");
  $("#crumbs").innerHTML=parts.map((p,i)=>i===parts.length-1?`<b>${esc(p.t)}</b>`:`<a data-i="${i}">${esc(p.t)}</a>`).join(" / ");
  [...$("#crumbs").querySelectorAll("a")].forEach(a=>a.onclick=()=>parts[+a.dataset.i].go());}

async function render(){setNav();const m=$("#main");
  if(S.top==="demand"){crumb([{t:"Demand Partners"}]);return renderDemandCatalog(m);}
  if(S.top==="analytics"){crumb([{t:"Analytics"}]);return renderAnalyticsSection(m);}
  if(S.top==="history"){crumb([{t:"History"}]);return renderHistory(m);}
  if(!S.pub){crumb([{t:"Publishers"}]);return renderPublishers(m);}
  if(S.plc) return renderPlacement(m);
  if(S.au) return renderAdUnit(m);
  if(S.site) return renderSite(m);
  return renderPublisher(m);
}

// ---- publishers list ----
async function renderPublishers(m){const pubs=await api("/v1/admin/publishers");
  m.innerHTML=`<div class="card"><div class="hdr"><h2>Publishers</h2><button class="btn small" id="pNew">+ New publisher</button></div><ul class="list" id="pl"></ul></div>`;
  const ul=$("#pl");if(!pubs.length)ul.innerHTML='<div class="empty">No publishers yet — click “+ New publisher”.</div>';
  pubs.forEach(p=>{const li=document.createElement("li");
    li.innerHTML=`<span>${esc(p.name)} <span class="pill ${p.status==='active'?'on':''}">${p.status}</span></span><span class="id">${p.id} ›</span>`;
    li.onclick=()=>go({pub:p,sub:"properties",site:null,au:null,plc:null});ul.appendChild(li);});
  $("#pNew").onclick=()=>openForm({title:"New publisher",submitLabel:"Create",
    fields:[{key:"name",label:"Name",placeholder:"Acme Media"},{key:"gam",label:"GAM network code",placeholder:"21775744923"}],
    onSubmit:async v=>{if(!v.name.trim())throw new Error("Name required");
      const p=await api("/v1/admin/publishers",{method:"POST",body:{name:v.name.trim(),gam_network_code:v.gam.trim()||null}});toast("Created");go({pub:p,sub:"properties"});}});}

// ---- publisher detail ----
async function renderPublisher(m){const p=S.pub;
  crumb([{t:"Publishers",go:()=>go({pub:null})},{t:p.name}]);
  m.innerHTML=`<div class="card"><div class="hdr"><h2>${esc(p.name)}</h2><span><button class="btn small" id="pubEdit" style="margin:0">Edit</button> <button class="btn small danger" id="pubDel" style="margin:0">Delete publisher</button></span></div>
    <div class="subtabs">${["properties","demand","overview"].map(s=>`<button data-s="${s}" class="${S.sub===s?'active':''}">${s[0].toUpperCase()+s.slice(1)}</button>`).join("")}</div>
    <div id="sub"></div></div>`;
  $("#pubEdit").onclick=()=>openForm({title:"Edit publisher",submitLabel:"Save",
    fields:[{key:"name",label:"Name",value:p.name},
      {key:"gam",label:"GAM network code",value:p.gam_network_code||""},
      {key:"status",label:"Status",type:"select",value:p.status,options:[{value:"active",label:"active"},{value:"paused",label:"paused (stops serving config)"}]}],
    onSubmit:async v=>{if(!v.name.trim())throw new Error("Name required");

      <div><label>VPAID ${tip("Execution mode for interactive VPAID ad creatives. <code>insecure</code> runs VPAID in the page context (most compatible), <code>secure</code> sandboxes it in an iframe, <code>disabled</code> rejects VPAID and plays plain VAST only.")}</label><select id="tVp"><option>insecure</option><option>secure</option><option>disabled</option></select></div></div>
      <div class="row" style="margin-top:8px">

async function genTag(){const d=await api(`/v1/admin/placements/${S.plc.id}/embed`);$("#tOut").value=d.tag;window._cfg=d.config;}
async function preflight(){const cfg=window._cfg||(await api(`/v1/admin/placements/${S.plc.id}/embed`)).config;const c=cfg;const out=[];
  const ok=(b,m)=>out.push({b,m});
  ok(!!c.adTag,"GAM VAST tag (data-tag) is set");
  ok(/^https?:\/\//.test(c.adTag||""),"GAM tag is a valid URL");
  ok(c.bidders.length>0,`At least one demand partner enabled (${c.bidders.length})`);
  if(c.placement==="instream")ok(!!c.video,"Instream content video URL is set");
  ok(!!c.divId,"Mount div id present");
  ok(!!c.prebidUrl,"Prebid bundle URL present");
  const pass=out.filter(x=>x.b).length;
  $("#tChecks").innerHTML=`<div class="card" style="margin-top:12px"><h2>Preflight — ${pass}/${out.length} passed</h2>`+
    out.map(x=>`<div class="check"><span class="ic">${x.b?'✅':'⚠️'}</span><span>${x.m}</span></div>`).join("")+
    `<p class="muted" style="margin-top:8px">A live in-browser test (Prebid request → response → GAM request → impression) is coming next — aligned to your existing debugger.</p></div>`;}

  el.innerHTML=`<div class="grid2">
    <div class="card"><h2>GAM ad request</h2>
    <label>Ad tag waterfall ${tip("Tags are tried <b>in order</b>. The next one is called only when the previous returns empty VAST, errors, or goes quiet past its timeout — so an opportunity nobody bought can still be filled by a backfill partner or your house tag. Every tag in the chain receives the full header-bidding result (<code>hb_pb</code>, <code>hb_bidder</code>, <code>hb_uuid</code>…) in its <code>cust_params</code>. The whole chain is <b>one</b> ad opportunity, however many tags it takes to fill.")}</label>
    <p class="muted" style="margin:0 0 8px">Tried top to bottom. Put your house / passback tag last.</p>
    <div id="gTags"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
      <button class="btn ghost" id="gAdd">+ Add tag</button><button class="btn" id="gSave">Save waterfall</button></div>
    <p class="muted" style="margin-top:8px">Each tag must be a VAST endpoint (<code>output=vast</code> for GAM). The final VAST URL is handed to the IMA SDK.</p></div>
    <div class="card"><h2>Key-values to target in GAM</h2>
    <p class="muted" style="margin:0 0 8px">Create price-priority line items in Google Ad Manager keyed on these:</p>
    <table><thead><tr><th>Key</th><th>Meaning</th></tr></thead><tbody>
    <tr><td><code>hb_pb</code></td><td>Winning price bucket (post floor-bias)</td></tr><tr><td><code>hb_bidder</code></td><td>Winning SSP</td></tr>
    <tr><td><code>hb_pb_&lt;bidder&gt;</code></td><td>Per-bidder price (send-all-bids)</td></tr><tr><td><code>hb_bidder_&lt;bidder&gt;</code></td><td>Per-bidder code</td></tr></tbody></table>
    <p class="muted" style="margin-top:10px">No-demand fallback calls GAM with <code>hb_pb=0.00</code> so your house line item serves. Line items/creatives are set up in GAM itself (GAM-API automation is a later phase).</p></div></div>`;
  // Seed from adTags; fall back to promoting a legacy single adTag so a
  // placement saved before the waterfall existed opens as a one-row chain.
  let rows=(c.adTags&&c.adTags.length)?c.adTags.map(t=>({url:t.url||"",label:t.label||"",timeoutMs:t.timeoutMs||3000}))
          :(c.adTag?[{url:c.adTag,label:"primary",timeoutMs:3000}]:[{url:"",label:"primary",timeoutMs:3000}]);

  function drawTags(){
    $("#gTags").innerHTML=rows.map((t,i)=>`
      <div class="card" style="padding:10px;margin-bottom:8px" data-i="${i}">
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px">
          <b style="min-width:18px">${i+1}</b>
          <input data-f="label" value="${esc(t.label||"")}" placeholder="label (e.g. Primary GAM, House)" style="flex:1"/>
          <button class="ghost small" data-up ${i===0?"disabled":""} title="Move up" style="margin:0">↑</button>
          <button class="ghost small" data-down ${i===rows.length-1?"disabled":""} title="Move down" style="margin:0">↓</button>
          <button class="ghost small danger" data-del ${rows.length===1?"disabled":""} title="Remove" style="margin:0">✕</button>
        </div>
        <textarea data-f="url" rows="3" placeholder="https://pubads.g.doubleclick.net/gampad/ads?iu=/NETWORK/ad_unit&sz=640x480&output=vast&...">${esc(t.url||"")}</textarea>
        <div style="display:flex;gap:6px;align-items:center;margin-top:4px">
          <span class="muted">timeout</span><input data-f="timeoutMs" type="number" min="500" max="15000" step="500" value="${t.timeoutMs||3000}" style="max-width:110px"/><span class="muted">ms</span>
          ${i===rows.length-1?'<span class="pill" style="margin-left:auto">last resort</span>':""}
        </div>
      </div>`).join("");
    // Read edits straight back into `rows` so reordering never loses uncommitted typing.
    $("#gTags").querySelectorAll("[data-i]").forEach(card=>{
      const i=+card.dataset.i;
      card.querySelectorAll("[data-f]").forEach(inp=>inp.oninput=()=>{
        rows[i][inp.dataset.f]=inp.dataset.f==="timeoutMs"?(parseInt(inp.value,10)||3000):inp.value;
        if(inp.dataset.f==="timeoutMs")return; });
      const mv=(a,b)=>{const t=rows[a];rows[a]=rows[b];rows[b]=t;drawTags();};
      const up=card.querySelector("[data-up]"),dn=card.querySelector("[data-down]"),del=card.querySelector("[data-del]");
      if(up)up.onclick=()=>mv(i,i-1);
      if(dn)dn.onclick=()=>mv(i,i+1);
      if(del)del.onclick=()=>{if(rows.length>1){rows.splice(i,1);drawTags();}};
    });
  }
  drawTags();
  $("#gAdd").onclick=()=>{rows.push({url:"",label:"",timeoutMs:3000});drawTags();};

  $("#gSave").onclick=async()=>{
    const clean=rows.map(t=>({url:(t.url||"").trim(),label:(t.label||"").trim()||null,timeoutMs:t.timeoutMs||3000}))
                    .filter(t=>t.url);
    if(!clean.length){toast("Add at least one tag URL","err");return;}
    const bad=clean.find(t=>!/^https?:\/\//.test(t.url));
    if(bad){toast("Tag URL must start with http:// or https://","err");return;}
    const cur=(await getPlc()).config;
    // adTag is intentionally omitted — the server mirrors entry #1 into it, so
    // sending a stale value here could contradict the new waterfall order.
    const {adTag,...rest}=cur;
    try{await api(`/v1/admin/placements/${S.plc.id}`,{method:"PATCH",body:{config:{...rest,adTags:clean}}});
      toast(`Waterfall saved (${clean.length} tag${clean.length>1?"s":""})`);
      rows=clean.map(t=>({url:t.url,label:t.label||"",timeoutMs:t.timeoutMs}));drawTags();
    }catch(e){toast(e.message,"err");}};}

// ---- shared reporting helpers (top-level Analytics + placement Analytics) ----
const DIM_L={day:"Day",week:"Week (Mon)",month:"Month",hour:"Hour",publisher:"Publisher",site:"Site",ad_unit:"Ad unit",placement:"Placement",
  format:"Format",player_type:"Player type",country:"Country",device:"Device",engine_version:"Engine version",refresh:"Initial vs refresh"};
const TIME_DIMS=["day","week","month","hour"];
// Metrics are grouped by WHO produced them. Reconciling against a GAM report
// kept mixing header-bidding numbers (Prebid, measured bid-side by the player)
// with ad-server numbers (what GAM served), so every table and KPI row keeps
// the two visibly apart. GAM revenue/eCPM are not observable from the player
// (IMA exposes no price) and are shown as "not connected", never estimated.
// [key, header, tooltip]. Every metric the API returns is in the CSV.
const RGROUPS=[
  {key:"page",label:"Page",cls:"g-page",cols:[["loads","Loads","Page loads — the player tag booted."],
    ["viewRate","View %","Share of loads that became viewable. — means not measured: only tags with data-lazy on report viewability."],
    ["adsPerLoad","Ads/load","Impressions per page load — the refresh multiplier; can exceed 1."]]},
  {key:"hb",label:"Header bidding (Prebid)",cls:"g-hb",cols:[["requests","Bid reqs","Prebid auctions run."],
    ["noBidRate","No-bid %","Auctions with no usable bid (no bidder answered, or the best bid was under floor-min)."],
    ["wins","Wins","Auctions that produced a winning header bid."],["winRate","Win rate","Wins ÷ bid requests."],
    ["hbImpressions","HB imps","Impressions on opportunities where header bidding won the auction. Upper bound: GAM can still serve a higher-priority line item over the hb_pb one."],
    ["hbImpShare","HB share","HB impressions ÷ all impressions."],
    ["avgCpmRaw","Avg bid","Average winning bid CPM, raw (before bias)."],["avgCpmBiased","Bid to GAM","Average CPM sent to GAM as hb_pb, after floor bias."],
    ["hbRevenue","HB revenue","Raw winning-bid CPMs ÷ 1000, for wins whose opportunity rendered. Bid-side estimate, not GAM-settled."],
    ["hbEcpm","HB eCPM","HB revenue ÷ HB impressions × 1000."],["hbRpm","HB RPM","HB revenue per 1000 page loads."]]},
  {key:"gam",label:"Ad server (GAM)",cls:"g-gam",cols:[["adRequests","Ad reqs","VAST calls to the ad server — one per waterfall tag tried. Expect ~10–20% more than GAM counts: ad blockers and closed pages stop some calls before they reach GAM."],
    ["impressions","Imps","Ads that started playing (all demand: HB, AdX, direct, house)."],
    ["fillRate","GAM fill","Impressions ÷ ad opportunities (distinct opportunities, not raw waterfall attempts)."],
    ["unfilledRate","Unfilled %","Opportunities where every ad tag failed to return a playable ad."],
    ["errorRate","Error %","IMA ad errors ÷ ad requests. See Ad errors below for the breakdown by cause."],
    ["completeRate","Completion","Completes ÷ impressions."]]}];
const MONEY=new Set(["avgCpmRaw","avgCpmBiased","hbRevenue","hbEcpm","hbRpm"]);
const PCT=new Set(["viewRate","fillRate","winRate","completeRate","noBidRate","unfilledRate","errorRate","hbImpShare"]);
const money=v=>v==null?"—":"$"+Number(v).toFixed(2),pct=v=>v==null?"—":(v*100).toFixed(1)+"%";
const fmtM=(k,v)=>MONEY.has(k)?money(v):PCT.has(k)?pct(v):(v??"—");
// Per-viewer convenience only (never shared state): remembered timezone and column view.
const pref={get(k,d){try{return localStorage.getItem("cp_an_"+k)||d;}catch(_){return d;}},set(k,v){try{localStorage.setItem("cp_an_"+k,v);}catch(_){}}};
const COL_VIEWS=[["all","All"],["hb","Header bidding"],["gam","Ad server (GAM)"]];
const colViewBtns=cur=>`<div style="display:flex;gap:4px">${COL_VIEWS.map(([v,l])=>`<button class="ghost small colv${cur===v?" on":""}" data-v="${v}" style="margin:0">${l}</button>`).join("")}</div>`;
// KPI tiles in the same three groups as the report columns.
function kpiGroups(s){const basis=s.fillRateBasis==="ad_request"?`of ${s.adOpportunities} opportunities`:`of ${s.requests} bid reqs (legacy)`;
  const nc=tip("The player cannot see what GAM earned: IMA exposes no price, and AdX / direct / house revenue is settled inside GAM. This needs the GAM reporting integration (backlog #1). Use GAM's own report until then.");
  const groups=[["Page","g-page",[["Player loads",s.loads,""],["View %",pct(s.viewRate),s.viewRate==null?"not measured (no data-lazy)":`${s.views} viewable`],["Ads / load",s.adsPerLoad??"—","refresh multiplier"]]],
    ["Header bidding (Prebid)","g-hb",[["Bid requests",s.requests,s.prebidUnavailable?`${s.prebidUnavailable} Prebid failed to load`:"Prebid auctions"],
      ["Win rate",pct(s.winRate),`${s.wins} wins`],["No-bid rate",pct(s.noBidRate),`${s.noBid??0} no usable bid`],
      ["HB impressions",s.hbImpressions,`${pct(s.hbImpShare)} of impressions`],
      ["Avg bid",money(s.avgCpmRaw),s.avgCpmBiased!=null?`${money(s.avgCpmBiased)} sent to GAM${s.biasUpliftPct!=null?` (+${s.biasUpliftPct}%)`:""}`:"raw winning bid"],
      ["HB revenue",money(s.hbRevenue),"bid-side estimate"],["HB eCPM",money(s.hbEcpm),"per HB impression"],["HB RPM",money(s.hbRpm),"per 1000 loads"]]],
    ["Ad server (GAM)","g-gam",[["Ad requests",s.adRequests,s.waterfallDepth>1?`${s.waterfallDepth} tags / opportunity`:"VAST calls"],
      ["Impressions",s.impressions,"all demand"],["GAM fill",pct(s.fillRate),basis],["Unfilled",pct(s.unfilledRate),`${s.unfilled??0} opportunities`],
      ["Error rate",pct(s.errorRate),`${s.errors} errors`],["Completion",pct(s.completeRate),`${s.completes} completes`],
      [`GAM revenue${nc}`,"—","not connected",1],[`GAM eCPM${nc}`,"—","not connected",1]]]];
  return groups.map(([t,c,items])=>`<div class="kgrp ${c}"><div class="kgl">${t}</div><div class="kpis">${items.map(([l,v,sub,off])=>`<div class="kpi${off?" nc":""}"><div class="l">${l}</div><div class="v">${v??"—"}</div><div class="s">${sub||""}</div></div>`).join("")}</div></div>`).join("");}
// Page / header-bidding / ad-server funnels — three scales, never stacked into one.
function funnelHtml(s){const fbar=arr=>{const mx=Math.max(1,...arr.map(x=>x[1]||0));return arr.map(([l,v,note])=>`<div><div class="flabel"><span>${l}</span><span>${note||v}</span></div><div class="bar"><i style="width:${((v||0)/mx*100).toFixed(1)}%"></i></div></div>`).join("");};
  return `<p class="muted" style="margin:0 0 6px">Per page load</p>${fbar([["Load",s.loads],["Viewable",s.views,s.viewRate==null?"not measured":null]])}
    <p class="muted" style="margin:14px 0 6px">Header bidding (Prebid) ${tip("Counted per ad opportunity, not per page load — with refresh on these can exceed the load count.")}</p><div class="hbbars">${fbar([["Bid request",s.requests],["Win",s.wins],["HB impression",s.hbImpressions]])}</div>
    <p class="muted" style="margin:14px 0 6px">Ad server (GAM)</p>${fbar([["Ad opportunity",s.adOpportunities],["Impression",s.impressions],["Complete",s.completes]])}`;}
// Why ads didn't fill: IMA errors grouped by cause, with a per-day pivot.
const SIDE_L={gam:["GAM","warn"],network:["Network","" ],player:["Player / creative","bad"],unknown:["Unknown",""]};
async function errorsCard(el,q){const e=await api("/v1/admin/analytics/errors?by_day=true"+q);
  if(!e.total){el.innerHTML=`<div class="empty">No ad errors in this range.</div>`;return;}
  const present=e.catalog.filter(c=>e.types.some(t=>t.type===c.type));
  const codes=type=>e.codes.filter(c=>c.type===type).slice(0,3).map(c=>`<code>${c.code??"—"}</code>`).join(" ");
  el.innerHTML=`<p class="muted" style="margin:0 0 8px">${e.total} errors on ${e.adRequests} ad requests (${pct(e.adRequests?e.total/e.adRequests:null)}). <b>GAM</b> = the ad server answered with nothing usable; <b>Network</b> = the request never completed; <b>Player / creative</b> = an ad came back and failed to play.</p>
    <div class="tblwrap"><table><thead><tr><th>Cause</th><th>Side</th><th>Errors</th><th>% of ad reqs</th><th>Top IMA codes</th></tr></thead><tbody>
    ${e.types.map(t=>`<tr><td><b>${esc(t.label)}</b></td><td><span class="pill ${SIDE_L[t.side][1]}">${SIDE_L[t.side][0]}</span></td><td>${t.count}</td><td>${pct(t.share)}</td><td>${codes(t.type)}</td></tr>`).join("")}</tbody></table></div>
    <p class="muted" style="margin:14px 0 6px">By day</p>
    <div class="tblwrap"><table class="rep"><thead><tr><th>Day</th>${present.map(c=>`<th>${esc(c.label)}</th>`).join("")}<th>Total</th></tr></thead><tbody>
    ${e.days.map(d=>`<tr><td>${d.day}</td>${present.map(c=>`<td>${d[c.type]||0}</td>`).join("")}<td><b>${d.total}</b></td></tr>`).join("")}</tbody></table></div>`;}
function biddersHtml(bd){return bd.length?`<div class="tblwrap"><table><thead><tr><th>Bidder</th><th>Bids</th><th>No-bid</th><th>Timeout</th><th>Error</th><th>Avg CPM</th><th>Latency</th><th>Wins</th></tr></thead><tbody>`+
  bd.map(r=>`<tr><td><b>${esc(r.bidder)}</b></td><td>${r.bid}</td><td>${r['no-bid']}</td><td>${r.timeout}</td><td>${r.error}</td><td>${money(r.avgCpm)}</td><td>${r.avgLatencyMs!=null?r.avgLatencyMs+' ms':'—'}</td><td>${r.wins}</td></tr>`).join("")+`</tbody></table></div>`
  :'<p class="muted">No bid responses in this range — check that the SSPs are enabled for this publisher and that the domain is approved with them.</p>';}
const ymd=(d,tz)=>new Intl.DateTimeFormat("en-CA",{timeZone:tz,year:"numeric",month:"2-digit",day:"2-digit"}).format(d);
const shiftDay=(s,n)=>{const d=new Date(s+"T12:00:00Z");d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);};
// Calendar ranges resolved in the report timezone, so "Yesterday" means the
// publisher's yesterday when the report is in their timezone.
function rangeDates(st){const t=ymd(new Date(),st.tz);
  switch(st.range){case "today":return[t,t];case "yesterday":{const y=shiftDay(t,-1);return[y,y];}
    case "7":return[shiftDay(t,-6),t];case "30":return[shiftDay(t,-29),t];
    case "month":return[t.slice(0,8)+"01",t];
    case "lastmonth":{const end=shiftDay(t.slice(0,8)+"01",-1);return[end.slice(0,8)+"01",end];}
    case "custom":return[st.dfrom||null,st.dto||null];default:return[null,null];}}
function scopeQuery(st){const [f,t]=rangeDates(st);const p=[["tz",st.tz],["date_from",f],["date_to",t],["publisher_id",st.pub],["site_id",st.site],
  ["ad_unit_id",st.au],["placement_id",st.plc],["format",st.fmt],["player_type",st.ptype],["country",st.country],["device",st.device]];
  return p.filter(([,v])=>v).map(([k,v])=>`&${k}=${encodeURIComponent(v)}`).join("");}
async function downloadCsv(path,name){const h={};if(TOKEN)h.Authorization="Bearer "+TOKEN;const r=await fetch(path,{headers:h});
  if(r.status===401){logout();throw new Error("Session expired — please log in again");}
  if(!r.ok)throw new Error(`Export failed (${r.status})`);
  const a=document.createElement("a");a.href=URL.createObjectURL(await r.blob());a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);}
// Sortable, drillable report table. rs = {dims, sort, order}; q = scope query string.
// onSort(sort,order) re-queries server-side; onDrill(dim,id) narrows the filter.
async function reportTable(el,{q,rs,onSort,onDrill,empty}){
  const dims=rs.dims,sq=rs.sort?`&sort=${rs.sort}&order=${rs.order}`:"";
  const r=await api(`/v1/admin/analytics/report?dimensions=${dims.join(",")}${sq}${q}`);
  if(!r.rows.length){el.innerHTML=`<div class="empty">${empty||"No data for this selection."}</div>`;return r;}
  // Column view: page context always, plus the chosen side (or both).
  const groups=RGROUPS.filter(g=>g.key==="page"||(rs.cols||"all")==="all"||g.key===rs.cols);
  const cols=groups.flatMap(g=>g.cols.map((c,i)=>[...c,g.cls,i===0]));
  const arrow=k=>r.sort===k?(r.order==="asc"?" ▲":" ▼"):"";
  const th=(k,l,t,cls="")=>`<th class="sort${r.sort===k?" on":""} ${cls}" data-sort="${k}"${t?` title="${esc(t)}"`:""}>${l}${arrow(k)}</th>`;
  const gcls=(c,first)=>`${c}${first?" gstart":""}`;
  const drillable=d=>onDrill&&["publisher","site","ad_unit"].includes(d);
  let prev=null;
  const body=r.rows.map(row=>{const lead=row[dims[0]];const rep=dims.length>1&&lead===prev&&r.sort===dims[0];prev=lead;
    return `<tr>${dims.map((d,i)=>{const v=row[d]??"—";const cell=drillable(d)?`<a href="#" class="drill" data-dim="${d}" data-id="${esc(row[d+"_id"])}" title="Drill into this ${esc(DIM_L[d].toLowerCase())}">${esc(v)}</a>`:esc(v);
      return `<td class="nowrap"${i===0&&rep?' style="color:var(--muted)"':""}>${i===0&&!TIME_DIMS.includes(d)?`<b>${cell}</b>`:cell}</td>`;}).join("")}
      ${cols.map(([k,,,c,f])=>`<td class="${gcls(c,f)}">${fmtM(k,row[k])}</td>`).join("")}</tr>`;}).join("");
  const t=r.totals||{};
  el.innerHTML=`<div class="tblwrap"><table class="rep"><thead>
    <tr class="band"><th colspan="${dims.length}"></th>${groups.map(g=>`<th colspan="${g.cols.length}" class="${g.cls} gstart">${g.label}</th>`).join("")}</tr>
    <tr>${dims.map(d=>th(d,DIM_L[d])).join("")}${cols.map(([k,l,tt,c,f])=>th(k,l,tt,gcls(c,f))).join("")}</tr></thead>
    <tbody>${body}</tbody><tfoot><tr><td colspan="${dims.length}"><b>Total</b></td>${cols.map(([k,,,c,f])=>`<td class="${gcls(c,f)}"><b>${fmtM(k,t[k])}</b></td>`).join("")}</tr></tfoot></table></div>
    <p class="muted" style="margin:8px 0 0">${r.truncated?`Showing ${r.rows.length} of ${r.total} rows — export CSV for all. `:`${r.total} row${r.total===1?"":"s"}. `}Days in ${esc(r.tz)}. Click a column to sort${onDrill?", a name to drill in":""}. GAM revenue &amp; eCPM are not available from the player — use GAM's report.</p>`;
  el.querySelectorAll("th[data-sort]").forEach(h=>h.onclick=()=>{const k=h.dataset.sort;
    onSort(k,r.sort===k?(r.order==="asc"?"desc":"asc"):(dims.includes(k)&&!TIME_DIMS.includes(k)?"asc":"desc"));});
  el.querySelectorAll("a.drill").forEach(a=>a.onclick=e=>{e.preventDefault();onDrill(a.dataset.dim,a.dataset.id);});
  return r;}

// ---- top-level Analytics (account-wide, dimensional) ----
const LOCAL_TZ=Intl.DateTimeFormat().resolvedOptions().timeZone||"UTC";
// Kept on S so filters survive navigating away and back.
S.an=S.an||{range:"7",dfrom:"",dto:"",tz:pref.get("tz","UTC"),pub:"",site:"",au:"",plc:"",fmt:"",ptype:"",country:"",device:"",d1:"publisher",d2:"",sort:null,order:null,cols:pref.get("cols","all")};
async function renderAnalyticsSection(m){const st=S.an;
  const opts=await api("/v1/admin/analytics/filters");
  const tzs=[...new Set(["UTC",LOCAL_TZ,"Europe/Prague","Asia/Kolkata",st.tz])];
  const dimOpts=(sel,none)=>(none?`<option value="">— none —</option>`:"")+opts.dimensions.map(d=>`<option value="${d}"${sel===d?" selected":""}>${DIM_L[d]||d}</option>`).join("");
  const sel=(id,label,items,cur,all="All")=>`<div style="flex:1 1 150px;min-width:130px"><label>${label}</label><select id="${id}"><option value="">${all}</option>${items.map(o=>`<option value="${esc(o.id)}"${o.id===cur?" selected":""}>${esc(o.name)}${o.deleted?" (deleted)":""}</option>`).join("")}</select></div>`;
  const simple=a=>a.map(v=>({id:v,name:v}));
  // Cascade: each level only offers children of the level above it.
  const siteIds=new Set(opts.sites.filter(s=>!st.pub||s.publisher_id===st.pub).map(s=>s.id));
  const aus=opts.ad_units.filter(a=>siteIds.has(a.site_id)&&(!st.site||a.site_id===st.site));const auIds=new Set(aus.map(a=>a.id));
  const plcs=opts.placements.filter(p=>auIds.has(p.ad_unit_id)&&(!st.au||p.ad_unit_id===st.au));
  const nameOf=(arr,id)=>(arr.find(x=>x.id===id)||{}).name;
  const scopeLbl=nameOf(opts.placements,st.plc)||nameOf(opts.ad_units,st.au)||nameOf(opts.sites,st.site)||nameOf(opts.publishers,st.pub)||"all publishers";
  const active=["pub","site","au","plc","fmt","ptype","country","device"].filter(k=>st[k]).length;
  m.innerHTML=`<div class="card"><div class="hdr"><h2>Analytics — ${esc(scopeLbl)}</h2>
    <div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap">
      <div><label>Range</label><select id="anR">${[["today","Today"],["yesterday","Yesterday"],["7","Last 7 days"],["30","Last 30 days"],["month","This month"],["lastmonth","Last month"],["0","All time"],["custom","Custom range…"]].map(([v,l])=>`<option value="${v}"${st.range===v?" selected":""}>${l}</option>`).join("")}</select></div>
      <div id="anCustom" style="display:${st.range==="custom"?"flex":"none"};gap:6px"><div><label>From</label><input type="date" id="anDf" value="${esc(st.dfrom)}"/></div><div><label>To</label><input type="date" id="anDt" value="${esc(st.dto)}"/></div></div>
      <div><label>Timezone ${tip("Where a day starts — for day/week/month rows, the wins chart and the date range. Use the publisher's timezone when reconciling with their GAM reports.")}</label><select id="anTz">${tzs.map(z=>`<option${z===st.tz?" selected":""}>${esc(z)}</option>`).join("")}</select></div>
      <button class="ghost small" id="anRef" style="margin:0">Refresh</button></div></div>
    <details id="anFilt"${active?" open":""} style="margin-bottom:14px"><summary class="muted" style="cursor:pointer">Filters${active?` · <b style="color:var(--accent)">${active} active</b>`:""}</summary>
      <div class="row" style="align-items:flex-end">
        ${sel("fPub","Publisher",opts.publishers,st.pub)}${sel("fSite","Site",opts.sites.filter(s=>siteIds.has(s.id)),st.site)}
        ${sel("fAu","Ad unit",aus,st.au)}${sel("fPlc","Placement",plcs,st.plc)}</div>
      <div class="row" style="align-items:flex-end">
        ${sel("fFmt","Format",simple(opts.formats),st.fmt)}${sel("fPt","Player type",simple(opts.player_types),st.ptype)}
        ${sel("fCc","Country",simple(opts.countries),st.country)}${sel("fDev","Device",simple(opts.devices),st.device)}
        <div style="flex:0 0 auto"><button class="ghost small" id="fClr" style="margin:0"${active?"":" disabled"}>Clear filters</button></div></div></details>
    <div id="anKpis"></div></div>
    <div class="grid2"><div class="card"><h2>Funnel</h2><div class="funnel" id="anFunnel"></div></div>
    <div class="card"><h2>Header-bidding wins over time (daily)</h2><div class="spark hbbars" id="anSpark"></div><p class="muted" id="anSparkLbl"></p></div></div>
    <div class="card"><div class="hdr"><h2>Report</h2>
      <div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap">
        <div><label>Rows by</label><select id="anD1">${dimOpts(st.d1)}</select></div>
        <div><label>then by</label><select id="anD2">${dimOpts(st.d2,true)}</select></div>
        <div style="display:flex;gap:4px">${[["Day-wise",st.d1==="day"&&!st.d2,"day",""],["Publisher × day",st.d1==="publisher"&&st.d2==="day","publisher","day"],["Site × day",st.d1==="site"&&st.d2==="day","site","day"]].map(([l,on,a,b])=>`<button class="ghost small preset${on?" on":""}" data-a="${a}" data-b="${b}" style="margin:0">${l}</button>`).join("")}</div>
        <button class="ghost small" id="anCsv" style="margin:0">Export CSV</button></div></div>
      <div class="hdr" style="justify-content:flex-start;gap:10px"><span class="muted">Columns</span>${colViewBtns(st.cols)}</div>
      <div id="anBreak"></div></div>
    <div class="card"><h2>Ad errors — why ads didn't fill ${tip("IMA ad errors grouped by cause. A spike in <b>No ad returned</b> means GAM had nothing to serve; a spike in <b>Creative failed to play</b> points at the player or the creative.")}</h2><div id="anErr"></div></div>
    <div class="card"><h2>Header-bidding partners</h2><div id="anBid"></div></div>`;
  const rerender=patch=>{Object.assign(st,patch);renderAnalyticsSection(m).catch(e=>toast(e.message,"err"));};
  const load=async()=>{const q=scopeQuery(st),qs="?"+q.slice(1);
    const [s,ts]=await Promise.all([api("/v1/admin/analytics/summary"+qs),api("/v1/admin/analytics/timeseries?bucket=day"+q)]);
    $("#anKpis").innerHTML=kpiGroups(s);
    $("#anFunnel").innerHTML=funnelHtml(s);
    errorsCard($("#anErr"),q).catch(e=>toast(e.message,"err"));
    api("/v1/admin/analytics/bidders"+qs).then(bd=>{$("#anBid").innerHTML=biddersHtml(bd);}).catch(e=>toast(e.message,"err"));
    const wins={};ts.filter(r=>r.event==="auction_win").forEach(r=>wins[r.ts.slice(0,10)]=r.count);const dys=Object.keys(wins).sort();const smax=Math.max(1,...dys.map(x=>wins[x]));
    $("#anSpark").innerHTML=dys.map(x=>`<i style="height:${(wins[x]/smax*100).toFixed(0)}%" title="${x}: ${wins[x]}"></i>`).join("")||'<span class="muted">no data</span>';
    $("#anSparkLbl").textContent=dys.length?`${dys[0]} → ${dys[dys.length-1]}`:"";
    await reportTable($("#anBreak"),{q,rs:{dims:[st.d1,st.d2].filter(Boolean),sort:st.sort,order:st.order,cols:st.cols},
      onSort:(sort,order)=>{st.sort=sort;st.order=order;load().catch(e=>toast(e.message,"err"));},
      // Drill: narrow to the clicked entity and break down one level deeper.
      onDrill:(dim,id)=>{const next={publisher:["pub","site"],site:["site","ad_unit"],ad_unit:["au","placement"]}[dim];
        rerender({[next[0]]:id,d1:next[1],d2:st.d2===next[1]?"":st.d2,sort:null,order:null});},
      empty:"No data yet — generate demo data on a placement, or wait for live traffic."});};
  $("#anRef").onclick=()=>load().catch(e=>toast(e.message,"err"));
  $("#anR").onchange=e=>rerender({range:e.target.value});
  $("#anDf").onchange=e=>{st.dfrom=e.target.value;load().catch(x=>toast(x.message,"err"));};
  $("#anDt").onchange=e=>{st.dto=e.target.value;load().catch(x=>toast(x.message,"err"));};
  $("#anTz").onchange=e=>{st.tz=e.target.value;pref.set("tz",st.tz);load().catch(x=>toast(x.message,"err"));};
  m.querySelectorAll(".colv").forEach(b=>b.onclick=()=>{pref.set("cols",b.dataset.v);rerender({cols:b.dataset.v});});
  // Changing a level clears the levels below it that no longer belong to it.
  $("#fPub").onchange=e=>rerender({pub:e.target.value,site:"",au:"",plc:""});
  $("#fSite").onchange=e=>rerender({site:e.target.value,au:"",plc:""});
  $("#fAu").onchange=e=>rerender({au:e.target.value,plc:""});
  [["fPlc","plc"],["fFmt","fmt"],["fPt","ptype"],["fCc","country"],["fDev","device"]].forEach(([id,k])=>$("#"+id).onchange=e=>rerender({[k]:e.target.value}));
  $("#fClr").onclick=()=>rerender({pub:"",site:"",au:"",plc:"",fmt:"",ptype:"",country:"",device:""});
  const setDims=(d1,d2)=>rerender({d1,d2:d2===d1?"":d2,sort:null,order:null});
  $("#anD1").onchange=e=>setDims(e.target.value,st.d2);$("#anD2").onchange=e=>setDims(st.d1,e.target.value);
  m.querySelectorAll(".preset").forEach(b=>b.onclick=()=>setDims(b.dataset.a,b.dataset.b));
  $("#anCsv").onclick=async()=>{const dims=[st.d1,st.d2].filter(Boolean);const [f,t]=rangeDates(st);
    try{await downloadCsv(`/v1/admin/analytics/report.csv?dimensions=${dims.join(",")}${st.sort?`&sort=${st.sort}&order=${st.order}`:""}${scopeQuery(st)}`,
      `report_${dims.join("_")}_${f||"all"}${t&&t!==f?"_"+t:""}.csv`);}catch(e){toast(e.message,"err");}};
  await load();
}

// ---- change history (audit log) ----
async function renderHistory(m){
  m.innerHTML=`<div class="card"><div class="hdr"><h2>Change history</h2>
    <div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap">
      <div><label>Action</label><select id="hAct"><option value="">all</option><option value="create">create</option><option value="update">update</option><option value="delete">delete</option><option value="restore">restore</option></select></div>
      <div><label>Entity</label><select id="hEnt"><option value="">all</option><option value="publisher">publisher</option><option value="site">site</option><option value="ad_unit">ad_unit</option><option value="placement">placement</option><option value="demand_partner">demand_partner</option><option value="publisher_demand">publisher_demand</option></select></div>
      <button class="ghost small" id="hRef" style="margin:0">Refresh</button></div></div>
    <p class="muted" style="margin:-6px 0 12px">Every create / update / delete / restore on publishers, sites, ad units, placements and demand. <b>IP</b> and <b>agent</b> are device hints, not identity (single admin login today).</p>
    <div id="hBody"></div></div>`;
  const fmtt=t=>{try{return new Date(t).toLocaleString();}catch(e){return t;}};
  const fmtv=v=>v==null?"∅":(typeof v==="object"?JSON.stringify(v):String(v));
  const pillCls=a=>({create:"on",update:"",delete:"bad",restore:"warn"}[a]||"");
  // A changed field whose value is an object (config_json, params_json, ...) is shown
  // as a "View changes" button instead of inline JSON — inlining it dwarfs every other
  // column and can push the table wider than its container (see history-overflow fix).
  const isObj=v=>v!=null&&typeof v==="object";
  const detail=(r,idx)=>{
    if(r.action==="update"&&r.changed_fields&&r.changed_fields.length)
      return r.changed_fields.map(f=>{
        const b=r.before&&r.before[f],a=r.after&&r.after[f];
        if(isObj(b)||isObj(a))return `<b>${esc(f)}</b>: <button class="btn small ghost" data-jsondiff="${idx}" data-field="${esc(f)}" style="margin:0">View changes</button>`;
        return `<b>${esc(f)}</b>: ${esc(fmtv(b))} → ${esc(fmtv(a))}`;
      }).join("<br>");
    return `<span class="muted">${esc(r.action)}d</span>`;
  };
  const load=async()=>{
    const qs=["limit=200"];const a=$("#hAct").value,e=$("#hEnt").value;
    if(a)qs.push("action="+encodeURIComponent(a));if(e)qs.push("entity_type="+encodeURIComponent(e));
    const rows=await api("/v1/admin/audit-log?"+qs.join("&"));
    if(!rows.length){$("#hBody").innerHTML='<div class="empty">No changes recorded for this filter.</div>';return;}
    $("#hBody").innerHTML=`<div class="tblwrap"><table><thead><tr><th>Time</th><th>Action</th><th>Entity</th><th>Name</th><th>Actor</th><th>IP</th><th>Agent</th><th>Details</th></tr></thead><tbody>`+
      rows.map((r,idx)=>`<tr><td class="nowrap">${esc(fmtt(r.created_at))}</td><td class="nowrap"><span class="pill ${pillCls(r.action)}">${esc(r.action)}</span></td>
        <td class="nowrap">${esc(r.entity_type)}</td><td style="max-width:280px" title="${esc(r.entity_id)}">${esc(r.entity_label||r.entity_id)}</td><td class="nowrap">${esc(r.actor||"—")}</td>
        <td class="id nowrap">${esc(r.ip||"—")}</td><td class="muted nowrap" style="max-width:180px;overflow:hidden;text-overflow:ellipsis" title="${esc(r.user_agent||"")}">${esc(r.user_agent||"—")}</td>
        <td class="muted" style="font-size:12px;max-width:260px">${detail(r,idx)}</td></tr>`).join("")+`</tbody></table></div>`;
    $("#hBody").onclick=e=>{
      const btn=e.target.closest("[data-jsondiff]");if(!btn)return;
      const r=rows[+btn.dataset.jsondiff],f=btn.dataset.field;
      const before=r.before&&r.before[f],after=r.after&&r.after[f];
      const beforeLines=(before===undefined?"∅":JSON.stringify(before,null,2)).split("\n");
      const afterLines=(after===undefined?"∅":JSON.stringify(after,null,2)).split("\n");
      const d=diffLines(beforeLines,afterLines);
      openViewer(`${f} — ${r.entity_label||r.entity_id}`,
        `<div class="grid2"><div><label>Before</label><pre>${diffLinesHtml(d.before)}</pre></div>
         <div><label>After</label><pre>${diffLinesHtml(d.after)}</pre></div></div>`);
    };
  };
  $("#hRef").onclick=load;$("#hAct").onchange=load;$("#hEnt").onchange=load;
  await load();
}

// ---- demand catalog (top-level) ----
async function renderDemandCatalog(m){const cat=await api("/v1/admin/demand-partners");
  m.innerHTML=`<div class="card"><div class="hdr"><h2>Demand partner catalog</h2><button class="btn small" id="dNew">+ Add partner</button></div>
    <p class="muted">The SSPs available platform-wide. Enable them per publisher inside a publisher's <b>Demand</b> tab.</p>
    <table><thead><tr><th>Code</th><th>Label</th><th>Adapter</th><th>Required params</th><th></th></tr></thead><tbody>
    ${cat.map(d=>`<tr><td><code>${esc(d.code)}</code></td><td>${esc(d.label)}</td><td class="muted">${esc(d.adapter_module)}</td><td class="muted">${d.required_params.join(", ")}</td><td style="text-align:right"><button class="btn small danger" data-del="${esc(d.id)}" data-code="${esc(d.code)}" style="margin:0">Delete</button></td></tr>`).join("")}</tbody></table></div>`;
  m.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>askDelete({kind:"demand partner",path:`/v1/admin/demand-partners/${b.dataset.del}`,name:b.dataset.code,after:()=>renderDemandCatalog(m)}));
  $("#dNew").onclick=()=>openForm({title:"Add demand partner",submitLabel:"Add to catalog",
    note:"The Prebid bundle served to publishers must also include this adapter, or it won't bid.",
    fields:[{key:"code",label:"Code",placeholder:"mynewssp"},{key:"label",label:"Label",placeholder:"My New SSP"},
      {key:"mod",label:"Adapter module",placeholder:"mynewsspBidAdapter"},{key:"params",label:"Required params (comma-separated)",placeholder:"placementId, siteId"}],
    onSubmit:async v=>{if(!v.code.trim())throw new Error("Code required");
      await api("/v1/admin/demand-partners",{method:"POST",body:{code:v.code.trim(),label:v.label.trim()||v.code.trim(),
        adapter_module:v.mod.trim()||v.code.trim()+"BidAdapter",required_params:v.params.split(",").map(s=>s.trim()).filter(Boolean)}});toast("Added");renderDemandCatalog(m);}});}
